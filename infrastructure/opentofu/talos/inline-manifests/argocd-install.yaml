---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: argocd-bootstrap
    namespace: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-bootstrap
  namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-bootstrap
  namespace: argocd
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: argocd-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: argocd-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # Use non-root user for helm image
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: argocd-bootstrap
          # --- IMAGE CHANGE ---
          image: alpine/helm:3.16.1 # Includes helm and kubectl
          # --- END IMAGE CHANGE ---
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          command:
            - sh
            - -c
            - |
              set -ex

              echo "Waiting for API server to be available..."
              until nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; do
                echo "DNS not ready, waiting..."
                sleep 5
              done

              echo "API server is up. Adding ArgoCD Helm repo..."
              helm repo add argo https://argoproj.github.io/argo-helm
              helm repo update

              echo "Fetching ArgoCD values from GitHub..."
              # Use curl to get values.yaml from the repo
              curl -sL https://raw.githubusercontent.com/amillerrr/homelab-single-proxmox-node/main/clusters/production/infrastructure/argocd/values.yaml -o /tmp/argocd-values.yaml

              echo "Installing ArgoCD via Helm..."
              # --- COMMAND CHANGE ---
              helm install argocd argo/argo-cd \
                --version 8.5.10 \
                --namespace argocd \
                --create-namespace \
                -f /tmp/argocd-values.yaml \
                --wait --timeout 10m
              # --- END COMMAND CHANGE ---

              echo "Waiting for ArgoCD deployments to be ready..."
              # Helm --wait should handle this, but double-check
              kubectl wait --for=condition=available --timeout=60s \
                deployment/argocd-server -n argocd

              kubectl wait --for=condition=available --timeout=60s \
                deployment/argocd-repo-server -n argocd

              kubectl wait --for=condition=available --timeout=60s \
                deployment/argocd-applicationset-controller -n argocd

              echo "ArgoCD components are ready."

              echo "Applying ApplicationSet manifests..."
              # These can still be applied with kubectl
              kubectl apply -f https://raw.githubusercontent.com/amillerrr/homelab-single-proxmox-node/main/clusters/production/bootstrap/appset-cluster-components.yaml
              kubectl apply -f https://raw.githubusercontent.com/amillerrr/homelab-single-proxmox-node/main/clusters/production/bootstrap/appset-cluster-components-no-prune.yaml

              echo "Bootstrap job complete."
      volumes:
        - name: tmp
          emptyDir: {}
