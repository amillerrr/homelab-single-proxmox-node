apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
spec:
  description: User applications and workloads
  sourceRepos:
    - '*'
  destinations:
    # Allow deployment to 'default' and any 'apps-*' namespace
    - namespace: 'default'
      server: '*'
    - namespace: 'apps-*'
      server: '*'
  # Deny access to cluster-level resources (CRDs, ClusterRoles) by default
  # Only allow specific safe resources if needed
  clusterResourceWhitelist:
    - group: 'gateway.networking.k8s.io'
      kind: 'HTTPRoute'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
