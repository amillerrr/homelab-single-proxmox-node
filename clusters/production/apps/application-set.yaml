apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          # Your existing apps
          - name: nginx-example
            path: apps/nginx-example
            namespace: default
            wave: "0"
            description: "Example nginx application"
          
          # Future apps go here
          # - name: home-assistant
          #   path: apps/home-assistant
          #   namespace: apps-home-automation
          #   wave: "0"

  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      labels:
        dev.homelab.stack: applications
    spec:
      project: applications # Points to the project.yaml above
      source:
        repoURL: https://github.com/amillerrr/homelab-single-proxmox-node.git
        targetRevision: main
        path: 'clusters/production/{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=true
