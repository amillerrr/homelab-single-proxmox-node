global:
  domain: argocd.mill3r.la

# Controller
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Server
server:
  service:
    type: ClusterIP
  
  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Enable insecure mode (no TLS, using Gateway for TLS termination)
  insecure: true
  
  # Extra args
  extraArgs:
    - --application-namespaces=*

# Repo Server - with Helm support
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Enable Helm charts in kustomize
  env:
    - name: KUSTOMIZE_PLUGIN_HOME
      value: /usr/local/bin/kustomize/plugin
    - name: ARGOCD_EXEC_TIMEOUT
      value: "180"

# ApplicationSet Controller
applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Notifications Controller
notifications:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Redis
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Dex (SSO) - disabled for homelab simplicity
dex:
  enabled: false

# Configs
configs:
  # ConfigMap for kustomize options
  cm:
    kustomize.buildOptions: "--enable-helm --load-restrictor LoadRestrictionsNone"
    application.namespaces: "*"
    
    # Resource tracking method
    application.resourceTrackingMethod: annotation
    
    # Timeout for sync operations
    timeout.reconciliation: 180s
  
  # Params
  params:
    server.insecure: true
    application.namespaces: "*"
    
    # ApplicationSet controller
    applicationsetcontroller.enable.progressive.syncs: true
    
    # Controller
    controller.status.processors: 20
    controller.operation.processors: 10
    controller.self.heal.timeout.seconds: 5
  
  # RBAC policies
  rbac:
    policy.default: role:readonly
    policy.csv: |
      # Default policies for AppProjects
      p, role:infrastructure-admin, applications, *, infrastructure/*, allow
      p, role:monitoring-admin, applications, *, monitoring/*, allow
      p, role:platform-admin, applications, *, platform/*, allow
      p, role:app-admin, applications, *, applications/*, allow
      
      # Grant admin all permissions
      g, admin, role:admin
