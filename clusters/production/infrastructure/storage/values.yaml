persistence:
  defaultClassReplicaCount: 1 # CRITICAL: Sets replicas to 1

preflight:
  enabled: false # Talos manages prerequisites, disable this check

preUpgradeChecker:
  jobEnabled: false

defaultSettings:
  backupTarget: ""
  backupTargetCredentialSecret: ""
  createDefaultDiskLabeledNodes: true
  defaultDataPath: "/var/lib/longhorn"
  replicaSoftAntiAffinity: false
  storageOverProvisioningPercentage: "100"
  storageMinimalAvailablePercentage: "10"
  defaultReplicaCount: "1" # CRITICAL: Sets default to 1 for single proxmox node
  guaranteedInstanceManagerCpu: "0"
  taintToleration: ""
  systemManagedComponentsNodeSelector: "node-role.kubernetes.io/worker:true"

# Restrict to workers
longhornManager:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"

longhornDriver:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"

longhornUI:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"

csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

# Optional: Expose the UI
# ingress:
#   enabled: true
#   ingressClassName: cilium
#   host: longhorn.your-domain.com
#   tls: true
#   tlsSecret: longhorn-tls
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-production
