apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

helmCharts:
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 5.41.0
    releaseName: loki-stack
    namespace: monitoring
    valuesInline:
      loki:
        enabled: true
        deploymentMode: SingleBinary
        auth_enabled: false
        commonConfig:
          path_prefix: /var/loki
          replication_factor: 1
        storage:
          type: 'filesystem'
          filesystem:
            chunks_directory: /var/loki/chunks
            rules_directory: /var/loki/rules
        schemaConfig:
          configs:
            - from: 2024-01-01
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        limits_config:
          retention_period: 168h
          enforce_metric_name: false
          reject_old_samples: true
          reject_old_samples_max_age: 168h
          max_cache_freshness_per_query: 10m
          split_queries_by_interval: 15m
          max_query_parallelism: 32
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 10Gi
            storageClass: local-path
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            readOnlyRootFilesystem: true
          extraVolumes:
            - name: tmp
              emptyDir: {}
          extraVolumeMounts:
            - name: tmp
              mountPath: /tmp
        gateway:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          service:
            type: ClusterIP
            port: 80
        storage_config:
          boltdb_shipper:
            active_index_directory: /var/loki/index
            cache_location: /var/loki/boltdb-cache
            shared_store: filesystem
          filesystem:
            directory: /var/loki/chunks
        # Explicitly disable scalable components
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        distributor:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        ruler:
          replicas: 0

      promtail:
        enabled: true
        config:
          clients:
            - url: http://loki-stack-gateway.monitoring.svc:80/loki/api/v1/push
          positions:
            filename: /tmp/positions.yaml
          scrape_configs:
            - job_name: kubernetes-pods
              pipeline_stages:
                - cri: {}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          readOnlyRootFilesystem: true
        extraVolumes:
          - name: logs
            hostPath:
              path: /var/log/pods
          - name: containerruntimesock
            hostPath:
              path: /run/containerd/containerd.sock
        extraVolumeMounts:
          - name: logs
            mountPath: /var/log/pods
            readOnly: true
          - name: containerruntimesock
            mountPath: /run/containerd/containerd.sock
            readOnly: true
        tolerations:
          - effect: NoSchedule
            operator: Exists

      # Disable other components
      grafana:
        enabled: false
      prometheus:
        enabled: true
      fluent-bit:
        enabled: false
      loki-canary:
        enabled: false
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false

commonAnnotations:
  app.kubernetes.io/part-of: monitoring-stack
  app.kubernetes.io/managed-by: argocd
