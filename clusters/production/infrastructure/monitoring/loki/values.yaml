# Top-level settings for the loki chart
loki:
  enabled: true
  # Use simple scalable mode for homelab
  deploymentMode: SingleBinary

  # Authentication disabled for homelab simplicity
  auth_enabled: false

  # Common config (Applies to multiple components if not single binary)
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  # Storage config - Minimal for filesystem
  storage:
    type: 'filesystem'
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
    # DO NOT add bucketNames for filesystem storage

  # Schema config
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem # Important for filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Limits
  limits_config:
    retention_period: 168h  # 7 days
    enforce_metric_name: false
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    max_query_parallelism: 32

  # Single binary deployment config (goes under top-level 'loki:')
  singleBinary:
    replicas: 1
    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Persistence
    persistence:
      enabled: true
      size: 10Gi
      storageClass: local-lvm # Ensure this StorageClass exists
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      fsGroup: 10001
      readOnlyRootFilesystem: true
    # Extra volumes for tmp
    extraVolumes:
      - name: tmp
        emptyDir: {}
    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp

  # Gateway (nginx) for Loki (goes under top-level 'loki:')
  gateway:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    service:
      type: ClusterIP
      port: 80

  # Add explicit storage_config for filesystem schema shipper
  # Sometimes required even with common.storage for singleBinary validation
  storage_config:
    boltdb_shipper:
      active_index_directory: /var/loki/index # Adjusted path
      cache_location: /var/loki/boltdb-cache # Adjusted path
      shared_store: filesystem # Explicitly state filesystem here too
    filesystem:
      directory: /var/loki/chunks

  # Explicitly disable scalable components to potentially satisfy validation
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  querier:
    enabled: false
  queryFrontend:
    enabled: false
  ingester:
    enabled: false
  distributor:
    enabled: false
  compactor:
    enabled: false
  indexGateway:
    enabled: false
  ruler:
    enabled: false

# Promtail Configuration (Log collector) - Stays at the top level
promtail:
  enabled: true
  config:
    clients:
      # Use the correct service name created by the loki chart (often includes release name)
      - url: http://loki-stack-gateway.monitoring.svc:80/loki/api/v1/push
    positions:
      filename: /tmp/positions.yaml
    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
  extraVolumes:
    - name: logs
      hostPath:
        path: /var/log/pods # Verify path for Talos/containerd logs
    - name: containerruntimesock
      hostPath:
        path: /run/containerd/containerd.sock # Verify socket path
  extraVolumeMounts:
    - name: logs
      mountPath: /var/log/pods
      readOnly: true
    - name: containerruntimesock
      mountPath: /run/containerd/containerd.sock
      readOnly: true
  tolerations:
    - effect: NoSchedule
      operator: Exists

# Grafana integration (disabled)
grafana:
  enabled: false

# Prometheus integration (enabled)
prometheus:
  enabled: true

# Fluent Bit (disabled)
fluent-bit:
  enabled: false

# Loki Canary (disabled)
loki-canary:
  enabled: false

# --- Explicitly disable chunks/results cache ---
# These might pull in dependencies expecting object storage if left to default
chunksCache:
  enabled: false
resultsCache:
  enabled: false
