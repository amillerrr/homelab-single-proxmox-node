apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 79.1.0
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesInline:
      crds:
        enabled: false


      # Prometheus Configuration
      prometheus:
        enabled: true
        
        prometheusSpec:
          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534

          podSecurityContext:
            fsGroup: 65534

          # Retention period
          retention: 15d
          retentionSize: "10GB"
          
          # Resource limits
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          
          # Storage
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 20Gi

          nodeSelector:
            node-role.kubernetes.io/worker: "true"
          
          # Service monitors selector
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          # Enable admin API for management
          enableAdminAPI: true
          
          # Scrape configs for Talos nodes
          # additionalScrapeConfigs:
          #   - job_name: 'talos-nodes'
          #     kubernetes_sd_configs:
          #       - role: node
          #     scheme: https
          #     tls_config:
          #       ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          #       insecure_skip_verify: true
          #     bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          #     relabel_configs:
          #       - source_labels: [__address__]
          #         regex: '(.*):10250'
          #         replacement: '${1}:9100'
          #         target_label: __address__

      grafana:
        enabled: false

      alertmanager:
        enabled: false
        
      # Node Exporter
      nodeExporter:
        enabled: true
        hostPID: true
        hostNetwork: true
        
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi

      # Kube State Metrics
      kube-state-metrics:
        enabled: true
        
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

      # Prometheus Operator
      prometheusOperator:
        enabled: true
        admissionWebhooks:
          enabled: true
          patch:
            enabled: true
            image:
              registry: registry.k8s.io
              repository: ingress-nginx/kube-webhook-certgen
              tag: v1.6.4
        tls:
          enabled: true

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534

      kubeProxy:
        enabled: false  # Disabled since we use Cilium

      # Default rules
      defaultRules:
        create: true
        rules:
          kubeProxy: false  # Disabled since we use Cilium

commonAnnotations:
  app.kubernetes.io/part-of: monitoring-stack
  app.kubernetes.io/managed-by: argocd
