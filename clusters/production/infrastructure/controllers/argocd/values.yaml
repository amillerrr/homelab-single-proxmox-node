global:
  domain: argocd.mill3r.la

# Controller
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Server
server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Enable insecure mode (no TLS, using Gateway for TLS termination)
  insecure: true
  extraArgs:
    - --application-namespaces=*

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Volumes needed for the sidecar and plugin configuration
  volumes:
    - name: argocd-cmp-server
      emptyDir: {}
    - name: cmp-config
      configMap:
        name: argocd-cmp-cm
        items:
          - key: kustomize-build-with-helm.yaml
            path: kustomize-build-with-helm.yaml
    - name: argocd-tmp
      emptyDir: {}
  # Container definition for the Custom Config Management Plugin (CMP)
  extraContainers:
    - name: kustomize-build-with-helm
      command: [ /var/run/argocd/argocd-cmp-server ]
      # Use a standard image that includes Kustomize and Helm
      image: ghcr.io/argoproj-labs/argocd-helm-client:v0.1.0 
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ ALL ]
      volumeMounts:
        - mountPath: /var/run/argocd
          name: argocd-cmp-server
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          name: cmp-config
          subPath: kustomize-build-with-helm.yaml
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: argocd-tmp
  
# ApplicationSet Controller
applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Notifications Controller
notifications:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Redis
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Dex (SSO) - disabled for homelab simplicity
dex:
  enabled: false

# Configs
configs:
  # ConfigMap for kustomize options
  cm:
    kustomize.buildOptions: "--enable-helm --load-restrictor LoadRestrictionsNone"
    application.namespaces: "*"
    # Resource tracking method
    application.resourceTrackingMethod: annotation
    # Timeout for sync operations
    timeout.reconciliation: 180s
    application.sync.options: "ServerSideApply=true"
  # Custom Config Management Plugin
  cmp:
    create: true
    plugins:
      kustomize-build-with-helm:
        generate:
          command: [ sh, -c ]
          args: [ kustomize build --enable-helm ]
  # Params
  params:
    controller.diff.server.side: true
    server.insecure: true
    application.namespaces: "*"
    # ApplicationSet controller
    applicationsetcontroller.enable.progressive.syncs: true
    # Controller
    controller.status.processors: 20
    controller.operation.processors: 10
    controller.self.heal.timeout.seconds: 5
    application.diff.strategy: "structured-merge-diff"

  
  # RBAC policies
  rbac:
    policy.default: role:readonly
    policy.csv: |
      # Default policies for AppProjects
      p, role:infrastructure-admin, applications, *, infrastructure/*, allow
      p, role:monitoring-admin, applications, *, monitoring/*, allow
      p, role:platform-admin, applications, *, platform/*, allow
      p, role:app-admin, applications, *, applications/*, allow
      
      # Grant admin all permissions
      g, admin, role:admin
