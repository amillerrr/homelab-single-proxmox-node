---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: sealed-secrets
            path: infrastructure/sealed-secrets
            namespace: sealed-secrets
            wave: "0"
            description: "Bitnami Sealed Secrets for secret encryption"
          
          - name: cert-manager
            path: infrastructure/cert-manager
            namespace: cert-manager
            wave: "1"
            description: "Jetstack cert-manager for certificate management"

          - name: cert-manager-rbac
            path: infrastructure/cert-manager-rbac
            namespace: kube-system
            wave: "2"
            description: "RBAC prerequisites for cert-manager (leader election)"
          
          - name: cert-manager-config
            path: config/cert-manager
            namespace: cert-manager
            wave: "3"
            description: "Cert-manager ClusterIssuer and API tokens"

          - name: longhorn
            path: infrastructure/storage
            namespace: longhorn-system
            wave: "4"
            description: "Longhorn Storage Provisioner"
  
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{.wave}}"
        description: "{{.description}}"
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: infrastructure
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/amillerrr/homelab-single-proxmox-node.git
        targetRevision: main
        path: "clusters/production/{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
        - group: longhorn.io
          kind: Setting
          jsonPointers:
            - /value
