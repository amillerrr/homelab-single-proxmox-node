---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: networking-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: wildcard-certificate
            path: config/certificates
            namespace: gateway
            wave: "0"
            description: "Wildcard TLS certificate for *.mill3r.la"
          
          - name: gateway
            path: infrastructure/gateway
            namespace: gateway
            wave: "1"
            description: "Cilium Gateway API resources (GatewayClass, Gateways)"
          
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{.wave}}"
        description: "{{.description}}"
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: networking
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/amillerrr/homelab-single-proxmox-node.git
        targetRevision: main
        path: "clusters/production/{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
