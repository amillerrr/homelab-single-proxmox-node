apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Platform components (Wave 0) - deployed first, no prune
  - appset-platform.yaml
  # Infrastructure components (Wave 1-4)
  - appset-infrastructure.yaml
  # Networking components (Wave 5-7)
  - appset-networking.yaml
  # Monitoring stack (Wave 8-9)
  - appset-monitoring.yaml
  # User applications (Wave 10+)
  - appset-applications.yaml

commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: cluster-bootstrap

commonAnnotations:
  app.kubernetes.io/version: "1.0.0"
