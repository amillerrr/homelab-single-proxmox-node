---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: kube-prometheus-stack
            path: infrastructure/monitoring/prometheus
            namespace: monitoring
            wave: "0"
            description: "Prometheus Operator, Grafana, and Alertmanager"
          
          - name: loki-stack
            path: infrastructure/monitoring/loki
            namespace: monitoring
            wave: "1"
            description: "Loki log aggregation with Promtail"
          
          - name: monitoring-routes
            path: config/monitoring
            namespace: monitoring
            wave: "2"
            description: "HTTPRoutes for Grafana, Prometheus, and Alertmanager"
  
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{.wave}}"
        description: "{{.description}}"
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: monitoring
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: monitoring
      source:
        repoURL: https://github.com/amillerrr/homelab-single-proxmox-node.git
        targetRevision: main
        path: "clusters/production/{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/replicas
          jqPathExpressions:
            - .status
        - group: ""
          kind: PersistentVolumeClaim
          jqPathExpressions:
            - .status
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
            - .metadata.generation
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
            - .metadata.generation
        - group: monitoring.coreos.com
          kind: Prometheus
          jqPathExpressions:
            - .status
        - group: monitoring.coreos.com
          kind: PrometheusRule
          jqPathExpressions:
            - .status
        - group: monitoring.coreos.com
          kind: ServiceMonitor
          jqPathExpressions:
            - .status
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .status
