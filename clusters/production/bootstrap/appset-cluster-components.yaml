---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-components
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: sealed-secrets
            path: infrastructure/sealed-secrets
            namespace: sealed-secrets
            wave: "1"
          - name: cert-manager
            path: infrastructure/cert-manager
            namespace: cert-manager
            wave: "2"
          - name: cert-manager-config
            path: config/cert-manager
            namespace: cert-manager
            wave: "3"
          - name: wildcard-certificate
            path: config/certificates
            namespace: gateway
            wave: "4"
          - name: gateway
            path: infrastructure/gateway
            namespace: gateway
            wave: "5"
          - name: routes
            path: config/routes
            namespace: default
            wave: "7"
          - name: nginx-example
            path: apps/nginx-example
            namespace: default
            wave: "8"
          # Monitoring Stack
          - name: kube-prometheus-stack
            path: infrastructure/monitoring/prometheus
            namespace: monitoring
            wave: "9"
          - name: loki-stack
            path: infrastructure/monitoring/loki
            namespace: monitoring
            wave: "10"
          - name: monitoring-routes
            path: config/monitoring
            namespace: monitoring
            wave: "11"
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{.wave}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/amillerrr/homelab-single-proxmox-node.git
        targetRevision: main
        path: "clusters/production/{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - Replace=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
